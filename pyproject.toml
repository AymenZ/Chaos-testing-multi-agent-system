[project]
name = "chaos-swarm"
version = "0.0.1"
description = "Multi-agent chaos tester for small Docker Compose stacks (API + Postgres)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
